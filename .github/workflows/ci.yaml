name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Acceptance tests must never run implicitly; they need real credentials and a designated
  # test account. They are a separate, manually triggered workflow.
  TF_ACC: ""

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(find . -name '*.go' -not -path '*/internal/generated/*' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector roughly triples the provider package's runtime, and that package drives a
      # real Terraform CLI per test, so the whole suite takes tens of minutes on a CI runner. The
      # timeout is set well above the observed time rather than close to it, because a suite that
      # fails on a slow runner is indistinguishable from a broken one.
      - name: Test
        run: go test -race -count=1 -timeout=60m ./...

      # A handful of tests skip themselves under -race, because terraform-plugin-testing serves
      # aliased provider configurations from one in-process server that races inside the framework
      # rather than in provider code. Without this step they would never run at all. Add any further
      # race-skipped test to this list.
      - name: Test the cases that cannot run under the race detector
        run: |
          go test -count=1 -timeout=10m ./internal/provider/ \
            -run 'TestAliasedProvidersAddressDifferentAccounts'

      - name: Check for whitespace errors
        run: git diff --check

  generated:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Regenerating from the pinned contracts with the pinned generator must be a no-op. A diff
      # here means either a contract changed without regeneration, or a generated file was edited
      # by hand.
      - name: Regenerate API clients
        run: go generate ./pkg/api/...

      - name: Fail on a generated diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'go generate ./pkg/api/...' and commit the result."
            exit 1
          fi

  docs:
    name: Documentation is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_wrapper: false

      # docs/ is generated from the provider's schema descriptions and the runnable configurations
      # under examples/. A diff means a schema or an example changed without the docs being
      # regenerated, which would ship a reference that contradicts the provider.
      - name: Regenerate documentation
        run: go generate ./tools/...

      - name: Fail on a documentation diff
        run: |
          if ! git diff --exit-code -- docs/; then
            echo "::error::Documentation is out of date. Run 'go generate ./tools/...' and commit the result."
            exit 1
          fi

      # Every examples/{resources,data-sources}/<name>.tf is embedded verbatim into that name's
      # documentation page, so unformatted or broken HCL ships as-is on the registry.
      - name: Check example formatting
        run: terraform fmt -check -recursive examples/

      - name: Validate the examples
        run: |
          mkdir -p "$RUNNER_TEMP/provider-bin"
          go build -o "$RUNNER_TEMP/provider-bin/terraform-provider-restate" .

          cat > "$RUNNER_TEMP/dev.tfrc" <<EOF
          provider_installation {
            dev_overrides {
              "restatedev/restate" = "$RUNNER_TEMP/provider-bin"
            }
            direct {}
          }
          EOF
          export TF_CLI_CONFIG_FILE="$RUNNER_TEMP/dev.tfrc"

          status=0

          # examples/resources/ and examples/data-sources/ are each a single Terraform module whose
          # files happen to be named after the page that embeds them, so validating the directory
          # validates every snippet together -- including the references they make to each other.
          # They are copied out first because they need a provider requirement injected, which the
          # reader of a documentation page is assumed to have already.
          for dir in examples/resources examples/data-sources; do
            work="$RUNNER_TEMP/validate/$(basename "$dir")"
            mkdir -p "$work"
            cp "$dir"/*.tf "$work/"

            cat > "$work/_provider.tf" <<'PROV'
          terraform {
            required_providers {
              restate = {
                source = "restatedev/restate"
              }
            }
          }
          PROV

            if ! terraform -chdir="$work" validate -no-color; then
              echo "::error file=$dir::examples do not validate"
              status=1
            fi
          done

          # The provider example and the two bootstrap stages declare their own provider
          # requirement, so they validate in place.
          for dir in examples/provider examples/two-stage-bootstrap/stage1-provision examples/two-stage-bootstrap/stage2-configure; do
            if ! terraform -chdir="$dir" validate -no-color; then
              echo "::error file=$dir::example does not validate"
              status=1
            fi
          done

          exit $status

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-go@v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

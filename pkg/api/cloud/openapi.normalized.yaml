components:
  schemas:
    GetUserIdentityRequest:
      type: object
      properties: {}
    ListAccountsRequest:
      type: object
      properties: {}
    GetUserLimitsRequest:
      type: object
      properties: {}
    ListOrganizationUsersRequest:
      type: object
      properties: {}
    PutAccountUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicAccountRoleId"
      required:
        - userId
        - roles
    PublicAccountRoleId:
      type: string
      minLength: 1
      description: Account-level role identifier. Built-in role IDs include `restate/AccountAdmin` and `restate/AccountReadOnly`. The `restate/*` prefix is reserved for Restate-supplied built-in roles; customer-defined role IDs must use a non-reserved namespace.
      example: restate/AccountAdmin
    DeleteAccountUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    PutAccountGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicAccountRoleId"
      required:
        - groupId
        - roles
    DeleteAccountGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListAccountRoleBindingsRequest:
      type: object
      properties: {}
    PutOrganizationUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicOrganizationRoleId"
      required:
        - userId
        - roles
    PublicOrganizationRoleId:
      type: string
      minLength: 1
      description: Organization-level role identifier. Built-in role IDs include `restate/OrganizationOwner` and `restate/OrganizationViewer`. The `restate/*` prefix is reserved for Restate-supplied built-in roles; customer-defined role IDs must use a non-reserved namespace.
      example: restate/OrganizationOwner
    DeleteOrganizationUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    PutOrganizationGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicOrganizationRoleId"
      required:
        - groupId
        - roles
    DeleteOrganizationGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListOrganizationGroupsRequest:
      type: object
      properties: {}
    ListOrganizationGroupMembersRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListOrganizationRoleBindingsRequest:
      type: object
      properties: {}
    CreateAccountRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - name
    DeleteAccountRequest:
      type: object
      properties:
        accountId:
          type: string
      required:
        - accountId
    UpdateAccountRequest:
      type: object
      properties:
        accountId:
          type: string
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - accountId
    AccountId:
      type: string
      description: Unique account identifier
      example: acc_1b2DE3f40
    DescribeAccountRequest:
      type: object
      properties: {}
    CreateStripePortalSessionRequest:
      type: object
      properties:
        returnUrl:
          type: string
    CreateEnvironmentRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
        region:
          type: string
        tierId:
          type: string
          enum:
            - FREE
            - STARTER
            - BUSINESS
            - PREMIUM
            - CUSTOM
        profileId:
          type: string
        payment:
          type: object
          properties:
            successUrl:
              type: string
            cancelUrl:
              type: string
          required:
            - successUrl
            - cancelUrl
      required:
        - name
    UpdateEnvironmentRequest:
      type: object
      properties:
        environmentId:
          type: string
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - environmentId
        - name
    UpdateEnvironmentTierRequest:
      type: object
      properties:
        environmentId:
          type: string
        tierId:
          type: string
          enum:
            - FREE
            - STARTER
            - BUSINESS
            - PREMIUM
            - CUSTOM
        payment:
          type: object
          properties:
            successUrl:
              type: string
            cancelUrl:
              type: string
          required:
            - successUrl
            - cancelUrl
      required:
        - environmentId
        - tierId
    GetAccountLimitsRequest:
      type: object
      properties: {}
    ListRegionsRequest:
      type: object
      properties: {}
    ListEnvironmentsRequest:
      type: object
      properties: {}
    DescribeEnvironmentRequest:
      type: object
      properties:
        environmentId:
          type: string
      required:
        - environmentId
    DestroyEnvironmentRequest:
      type: object
      properties:
        environmentId:
          type: string
      required:
        - environmentId
    CreateApiKeyRequest:
      type: object
      properties:
        environmentId:
          type: string
        roleId:
          $ref: "#/components/schemas/RoleId"
        description:
          type: string
      required:
        - environmentId
        - roleId
    RoleId:
      type: string
      enum:
        - rst:role::FullAccess
        - rst:role::IngressAccess
        - rst:role::AdminAccess
        - rst:role::CompleteAwakeableAccess
        - rst:role::TunnelAccess
      description: Role identifier for an environment-scoped API key.
      example: rst:role::FullAccess
    ListApiKeysRequest:
      type: object
      properties:
        environmentId:
          type: string
      required:
        - environmentId
    DescribeApiKeyRequest:
      type: object
      properties:
        keyId:
          type: string
        environmentId:
          type: string
      required:
        - keyId
        - environmentId
    DeleteApiKeyRequest:
      type: object
      properties:

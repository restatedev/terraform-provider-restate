          additionalProperties: false
        infrastructure:
          type: object
          properties:
            machineType:
              type: string
          additionalProperties: false
        grantId:
          description: The region grant the region is built with.
          $ref: "#/components/schemas/RegionGrantId"
        grantInputs:
          $ref: "#/components/schemas/RegionGrantInputs"
        access:
          description: "AWS regions you built: who may reach the region's entry point.
            Absent while nobody has set it, which leaves the entry point open to
            every address."
          $ref: "#/components/schemas/RegionAccess"
        status:
          $ref: "#/components/schemas/RegionStatus"
        statusReason:
          type: string
          description: "Why the region has its status: PREPARING, AWAITING_SETUP,
            AWAITING_GRANT, CREATING_INFRASTRUCTURE, DEPLOYING,
            NEEDS_RESTATE_ATTENTION, SETUP_EXPIRED, REJECTED or ABORTED. More
            may be added: treat one you do not know by its status."
        requiredAction:
          description: Present while the region waits for you.
          type: object
          properties:
            kind:
              type: string
              enum:
                - RUN_INSTALLER
                - APPLY_GRANT
              description: "RUN_INSTALLER: retired with INSTALLER regions, which can no longer
                be created. APPLY_GRANT: apply the grant module with
                grantInputs, then call SetRegionGrant with its output."
            deadlineAt:
              description: "RUN_INSTALLER: when the region fails if the installer has not been
                applied."
              type: string
          required:
            - kind
          additionalProperties: false
        createdAt:
          type: string
      required:
        - regionId
        - name
        - displayName
        - setup
        - cloud
        - cloudRegion
        - infrastructure
        - status
        - createdAt
      additionalProperties: false

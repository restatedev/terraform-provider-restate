      additionalProperties: false
    CreateRegionResponse:
      $ref: "#/components/schemas/RegionDescription"
    RegionGrantInputs:
      type: object
      properties:
        regionName:
          type: string
          description: "region_name: the prefix of the region's resource names."
        externalId:
          description: "external_id (AWS): what the role's trust policy requires."
          type: string
        regionTag:
          description: "region_tag (GCP, Azure): the label on your project, or the tag on
            the resource group."
          type: string
        restatePrincipals:
          description: "restate_principals (AWS): the roles that may assume the grant."
          type: array
          items:
            type: string
        compositionIssuer:
          description: "composition_issuer (GCP, Azure): the identity issuer the grant
            trusts."
          type: string
        restateIssuer:
          description: "restate_issuer: Restate's OIDC issuer, which signs the region's
            own token. Set for a region with an identity of its own, which is
            fixed when the region is created. externalId, regionTag,
            restatePrincipals and compositionIssuer are then absent."
          type: string
        regionSubject:
          description: "region_subject: the subject of the region's token, `region:<region
            id>`."
          type: string
        tokenAudience:
          description: "token_audience: the audience of the region's token, which the
            grant requires."
          type: string
      required:
        - regionName
      additionalProperties: false
      description: "GRANT regions: the inputs of the grant module, named after its
        variables."
    RegionAccess:
      type: object
      properties:
        entrySourceCidrs:
          description: "AWS: the IPv4 networks that may reach the region's load balancer
            directly, such as 203.0.113.0/24. Each must be a network address
            with no host bits set, at most 10 in all. Leave it out to admit
            every address. An empty list admits no client directly, so the
            region is reached only through PrivateLink. Restate's control plane
            is never admitted by this list."
          maxItems: 10
          type: array
          items:
            type: string
        privateLink:
          description: "AWS: publish a VPC endpoint service on the region's load balancer,
            so that the listed principals can connect through interface
            endpoints. Traffic through an endpoint does not carry the consumer's
            address, so the principals decide who connects, and entrySourceCidrs
            does not apply to it. Restate's own AWS account is always admitted,
            and no request can change that. With enabled false, or with the
            field left out, the region has no endpoint service."
          type: object
          properties:
            enabled:
              type: boolean
            allowedPrincipals:
              maxItems: 20
              type: array
              items:
                type: string
                pattern: ^arn:aws:iam::[0-9]{12}:(root|role\/.+|user\/.+)$
            acceptanceRequired:
              type: boolean
            endpointService:
              description: Once AWS has created the endpoint service.
              $ref: "#/components/schemas/RegionEndpointService"
          required:
            - enabled
          additionalProperties: false
      additionalProperties: false
      description: "AWS: who may reach the region's entry point, as SetRegionAccess
        last set it."
    RegionEndpointService:
      type: object
      properties:
        serviceName:
          description: "The name to give an interface endpoint: com.amazonaws.vpce.…"
          type: string
        state:
          description: The state AWS reports for the service, such as Available.
          type: string
        availabilityZoneIds:
          description: The zones the service covers. Zone names differ between accounts,
            so match your endpoint subnets by zone id.
          type: array
          items:
            type: string
      additionalProperties: false
    RegionDescription:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
        name:
          type: string
        displayName:
          type: string
        setup:
          $ref: "#/components/schemas/RegionSetup"
        cloud:
          type: string
          enum:
            - aws
            - azure
            - gcp
        cloudRegion:
          type: string
        aws:
          type: object
          properties:
            accountId:
              type: string
              description: The AWS account the region runs in.
              example: "123456789012"
          required:

        not valid, answers 400. The call replaces the region's whole access
        setting, so send every field you want to keep. DescribeRegion shows the
        setting and, once AWS has created it, the endpoint service to connect
        to. Restate's own AWS account always stays among the principals of an
        enabled endpoint service. A list of allowed networks also keeps out

        new one. DELETED: it was deleted."
    RegionGrantStatusReason:
      description: "Present while the grant is PENDING. AWAITING_CONFIRMATION: call
        ConfirmRegionGrant with the grant module's output. CONFIRMING: the grant
        is being set up, because Restate is signing in through it, and it turns
        READY once your cloud accepts the sign-in. CONFIRMATION_FAILED: your
        cloud kept refusing the sign-in; statusMessage has its answer. Fix the
        grant and call ConfirmRegionGrant again."
      type: string
      enum:
        - AWAITING_CONFIRMATION
        - CONFIRMING
        - CONFIRMATION_FAILED

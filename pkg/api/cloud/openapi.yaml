  /{accountId}/CreateWebhook:
    post:
      operationId: CreateWebhook
      summary: Create an incoming webhook that sends requests to one handler of an
        environment
      description: "Creates a webhook and returns metadata only. Call DescribeWebhook
        with the returned webhookId to retrieve its URL. The mode sets how the
        webhook delivers requests: async (the default) answers 202 as soon as
        Restate accepts the invocation and never returns the handler's result;
        sync waits for the handler, like a call to the environment's ingress,
        and returns its response to the sender; it answers 504 if the handler
        has not finished within 60 seconds (the invocation keeps running); most
        senders stop waiting much sooner, so sync handlers should answer within
        a few seconds. Sync mode is available only in regions where it is
        enabled; elsewhere CreateWebhook rejects it with 400. The mode cannot be
        changed after creation. Creating a webhook makes the configured handler
        publicly callable by anyone with its URL. The URL is a unique invocation
        address, not a secret credential or proof of sender identity. Handlers
        that require trusted senders must validate signatures or other
        application-level authentication. The optional idempotency-key header
        deduplicates retries while the invocation is running and for at least 60
        seconds after completion; Restate prunes the result later, so the window
        can be longer. A key deduplicates only the same caller's retry of the
        identical request, for this operation and account; reusing the key for a
        different request is refused with 422. Use a new key for each new
        request and reuse it only for retries of that identical request. After
        that, a retry may still return the original response, or may create
        another webhook. If creation has an uncertain outcome, a principal with
        viewer access can use ListWebhooks to recover the webhookId, then an
        authorized administrator can use DescribeWebhook to retrieve its URL.
        Management API keys cannot list webhooks, so recovery may require
        another principal. The completed invocation journal is not retained."
      parameters:
        - in: path
          name: accountId
          schema:
            $ref: "#/components/schemas/AccountId"
          required: true
          description: Unique account identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "200":
          description: The operation completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateWebhookResponse"
        "400":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientError"
        "401":

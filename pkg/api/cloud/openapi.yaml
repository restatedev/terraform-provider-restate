                description: "Why the region has its status: PREPARING, AWAITING_SETUP,
                  AWAITING_GRANT, CREATING_INFRASTRUCTURE, DEPLOYING,
                  NEEDS_RESTATE_ATTENTION, SETUP_EXPIRED, REJECTED or ABORTED.
                  More may be added: treat one you do not know by its status."
            required:
              - regionName
            additionalProperties: false
      required:
        - regions
      additionalProperties: false
    RegionStatus:
      type: string
      enum:
        - PENDING
        - ACTIVE
        - FAILED
        - DELETING
        - DELETED
      description: PENDING while the region is being set up; DELETING and DELETED once
        its deletion starts.
    DescribeByocAuthorizationResponse:
      type: object
      properties:
        authorized:
          type: boolean
          description: Whether this account may register BYOC regions.
        grantedBy:
          description: "Which grant allows it: the account's own, or its organization's."
          type: string
          enum:
            - account
            - organization
      required:
        - authorized
      additionalProperties: false
    ReserveByocRegionResponse:
      type: object
      properties:
        regionId:
          type: string
          description: The region's key. `RegisterByocRegion` for the same name completes
            this region.
          example: rgn_1a2b3c
        domainName:
          description: "The domain registration gives the region. A region can configure
            its cluster with it before it registers: `RegisterByocRegion`
            refuses a `baseDomain` that would give the region another one.
            Absent on a stage with no BYOC domain."
          example: 1a2b3c.byoc.dev.restate.cloud
          type: string
        imagePull:
          description: "What a region with no cluster yet pulls its node-local registry
            with: a Restate API key for the registry proxy. Shown once. Absent
            when the region is already registered, since it holds the credential
            registration delivered. Calling again for the same account while the
            region is unregistered revokes the previous key and returns a new
            one. Registration replaces this key when it hands the region over,
            and keeps it working for 24 hours so the cluster can switch to the
            replacement. An unregistered reservation expires after 7 days, which
            revokes this key."
          type: object
          properties:
            registry:
              type: string
            username:
              type: string
            password:
              type: string
            repositoryPrefix:
              type: string
              description: "What a repository name is appended to: the registry host and this
                stage's prefix. `restate-byoc-components`,
                `restate-byoc-bundle-registry`, `restate-byoc-registry-front`
                and `restate-byoc-registry-agent` all live under it."
              example: registry.dev.restate.cloud/dev-
          required:
            - registry
            - username
            - password
            - repositoryPrefix
          additionalProperties: false
      required:
        - regionId
      additionalProperties: false
    RegisterByocRegionResponse:
      type: object
      properties:
        regionId:
          type: string
          description: The region's key, generated on first registration and stable across
            repeats. The name in the request is what the region's domain and its
            Kubernetes objects are named after.
          example: rgn_1a2b3c
        type:
          type: string
          enum:
            - xp-aws
            - xp-azure
            - xp-gcp
          description: "Region type derived from `cloud`. Always an `xp-` type: a region
            registered here was provisioned by Restate's own Crossplane
            compositions, which is also what makes it control-plane-authored."
        domainName:
          type: string
          description: The region's public domain, built from the generated region id.
          example: 1a2b3c4d5e.byoc.restate.cloud
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
        created:
          type: boolean
          description: False when the region already existed, so a repeated registration
            reads as a repeat.
        apiKey:
          description: The region's access key, returned only when this call created the
            region. There is no way to read it back afterwards.
          type: string
        imagePull:
          description: "What the region pulls Restate's images with: a Restate API key for
            the registry proxy, not a cloud credential. Shown once, on the
            registration that minted it; a repeat returns nothing here because
            the key cannot be read back."
          type: object
          properties:
            registry:
              type: string
            username:
              type: string
            password:
              type: string
          required:
            - registry
            - username
            - password
          additionalProperties: false
        missingFields:
          description: Per-cloud facts the region still needs before it can leave PENDING.
            Present means the identity was issued and the region exists, but is
            not yet active.
          type: array
          items:
            type: string
      required:
        - regionId
        - type
        - domainName
        - status
        - created
      additionalProperties: false
    CreateByokRegistrationKeyResponse:
      type: object
      properties:
        registrationKey:
          type: string
          description: Registers one BYOK region for this account, cloud and provider
            region, once. Shown only in this response. Give it to the BYOC chart
            as its registration Secret.
          example: rrk_1a2b3c.4d5e6f
        regionId:
          description: The id the key gives the region it registers, reserved when the key
            is minted. Give it to the BYOC chart as `region.id`. The chart
            derives the region's Concierge audience and proxy endpoint from it.
          $ref: "#/components/schemas/RegionId"
        expiresAt:
          type: string
          description: When the key stops working if no region has used it.
          example: 2026-11-16T22:00:00.000Z
        imagePull:
          description: What the customer copies Restate's private images into their own
            registry with, before the region exists. A Restate API key for the
            registry proxy that pulls the images of the region this key reserves
            and nothing else. Shown only in this response. It stops working when
            the registration key expires unused, or when the account closes.
            After a region registers with the key it keeps working until the
            region activates, and for 24 hours after that, while the region's
            own pull key replaces it. A region that has not activated 7 days
            after it registered loses the key. Absent on a stage that serves no
            images.
          type: object
          properties:
            registry:
              type: string
              description: The registry proxy to copy images from.
              example: registry.us.restate.cloud
            username:
              type: string
              description: Any value works. Docker and crane insist on one.
            password:
              type: string
              description: A Restate API key for the registry proxy. Shown only in this
                response.
            repositoryPrefix:
              type: string
              description: "What a repository name is appended to: the registry host and this
                stage's prefix. The private images of the region (the region
                installation operator, the cloud operator, ingress and tunnel)
                live under it."
              example: registry.dev.restate.cloud/dev-
          required:
            - registry
            - username
            - password
            - repositoryPrefix
          additionalProperties: false
      required:
        - registrationKey
        - regionId
        - expiresAt
      additionalProperties: false
    ForbiddenError:
      type: object
      properties:
        code:
          type: number

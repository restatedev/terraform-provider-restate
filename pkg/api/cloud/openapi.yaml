components:
  schemas:
    GetUserIdentityRequest:
      type: object
      properties: {}
    CheckPermissionRequest:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: CreateAccount
          required:
            - action
          additionalProperties: false
      type: object
    ListAccountsRequest:
      type: object
      properties: {}
    GetUserLimitsRequest:
      type: object
      properties: {}
    ListOrganizationUsersRequest:
      type: object
      properties: {}
    AccountId:
      type: string
      description: Unique account identifier
      example: acc_1b2DE3f40
    PutAccountUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicAccountRoleId"
      required:
        - userId
        - roles
    PublicAccountRoleId:
      type: string
      minLength: 1
      description: Account-level role identifier. Built-in role IDs include
        `restate/AccountAdmin` and `restate/AccountReadOnly`. The `restate/*`
        prefix is reserved for Restate-supplied built-in roles; customer-defined
        role IDs must use a non-reserved namespace.
      example: restate/AccountAdmin
    DeleteAccountUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    PutDefaultOrganizationMembersRoleBindingRequest:
      type: object
      properties:
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicAccountRoleId"
        expectedRevision:
          description: Opaque revision from ListAccountRoleBindings. A stale revision is
            rejected with 409; omit only for legacy unconditional writes.
          type: string
          minLength: 1
      required:
        - roles
      additionalProperties: false
    DeleteDefaultOrganizationMembersRoleBindingRequest:
      type: object
      properties:
        expectedRevision:
          description: Opaque revision from ListAccountRoleBindings. A stale revision is
            rejected with 409; omit only for legacy unconditional writes.
          type: string
          minLength: 1
      additionalProperties: false
    PutAccountGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicAccountRoleId"
      required:
        - groupId
        - roles
    DeleteAccountGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListAccountRoleBindingsRequest:
      type: object
      properties: {}
    PutOrganizationUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicOrganizationRoleId"
      required:
        - userId
        - roles
    PublicOrganizationRoleId:
      type: string
      minLength: 1
      description: Organization-level role identifier. Built-in role IDs include
        `restate/OrganizationOwner` and `restate/OrganizationViewer`. The
        `restate/*` prefix is reserved for Restate-supplied built-in roles;
        customer-defined role IDs must use a non-reserved namespace.
      example: restate/OrganizationOwner
    DeleteOrganizationUserRoleBindingRequest:
      type: object
      properties:
        userId:
          type: string
      required:
        - userId
    PutOrganizationGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
        roles:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/PublicOrganizationRoleId"
      required:
        - groupId
        - roles
    DeleteOrganizationGroupRoleBindingRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListOrganizationGroupsRequest:
      type: object
      properties: {}
    ListOrganizationGroupMembersRequest:
      type: object
      properties:
        groupId:
          type: string
      required:
        - groupId
    ListOrganizationRoleBindingsRequest:
      type: object
      properties: {}
    CreateOrganizationApiKeyRequest:
      type: object
      properties:
        roleId:
          $ref: "#/components/schemas/OrganizationApiKeyRoleId"
        description:
          type: string
      required:
        - roleId
    OrganizationApiKeyRoleId:
      type: string
      enum:
        - rst:role::OrganizationAccountCreatorAccess
        - rst:role::OrganizationRegionGrantAccess
      description: Role of an organization-scoped API key.
        OrganizationAccountCreatorAccess creates accounts in the organization.
        OrganizationRegionGrantAccess manages the organization's region grants
        and builds regions with them in its accounts.
    ListOrganizationApiKeysRequest:
      type: object
      properties: {}
    DeleteOrganizationApiKeyRequest:
      type: object
      properties:
        keyId:
          type: string
      required:
        - keyId
    CreateAccountRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - name
    DeleteAccountRequest:
      type: object
      properties:
        accountId:
          type: string
      required:
        - accountId
    UpdateAccountRequest:
      type: object
      properties:
        accountId:
          type: string
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - accountId
    DescribeAccountRequest:
      type: object
      properties: {}
    CreateStripePortalSessionRequest:
      type: object
      properties:
        returnUrl:
          type: string
    CreateEnvironmentRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
        region:
          type: string
        tierId:
          type: string
          enum:
            - FREE
            - STARTER
            - BUSINESS
            - PREMIUM
            - CUSTOM
        profileId:
          type: string
        payment:
          type: object
          properties:
            successUrl:
              type: string
            cancelUrl:
              type: string
          required:
            - successUrl
            - cancelUrl
      required:
        - name
    UpdateEnvironmentRequest:
      type: object
      properties:
        environmentId:
          type: string
        name:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$
      required:
        - environmentId
        - name
    UpdateEnvironmentTierRequest:
      type: object
      properties:
        environmentId:
          type: string
        tierId:
          type: string
          enum:
            - FREE
            - STARTER
            - BUSINESS
            - PREMIUM
            - CUSTOM
        payment:
          type: object
          properties:
            successUrl:
              type: string
            cancelUrl:
              type: string
          required:
            - successUrl
            - cancelUrl
      required:
        - environmentId
        - tierId
    GetAccountLimitsRequest:
      type: object
      properties: {}
    ListRegionsRequest:
      type: object
      properties: {}
    DescribeByocAuthorizationRequest:
      type: object
      properties: {}
    ReserveByocRegionRequest:
      type: object
      properties:
        region:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$
          description: A short name for the region, unique across registrations.
            Identifies this registration so that repeating it is safe; the
            region's domain and Kubernetes objects are named after the generated
            region id instead.
          example: my-region
        cloud:
          type: string
          enum:
            - aws
            - azure
            - gcp
          description: Cloud the region's cluster will run on.
        accountId:
          description: Restate account the region is reserved for. Defaults to the account
            the call addresses.
          example: acc_1a2b3c
          type: string
          pattern: ^acc_[A-Za-z0-9]+$
        providerRegion:
          type: string
          minLength: 1
          description: The cloud's own name for where the region will run, as
            `RegisterByocRegion` takes it. On Azure the lowercase ARM location
            name.
          example: westeurope
      required:
        - region
        - cloud
        - providerRegion
      additionalProperties: false
    RegisterByocRegionRequest:
      type: object
      properties:
        releasePackage:
          description: Initial region release Function package, pinned by digest. Later
            targets are owned by the region virtual object.
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:/-]*@sha256:[a-f0-9]{64}$
        region:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$
          description: A short name for the region, unique across registrations.
            Identifies this registration so that repeating it is safe; the
            region's domain and Kubernetes objects are named after the generated
            region id instead.
          example: my-region
        cloud:
          type: string
          enum:
            - aws
            - azure
            - gcp
          description: Cloud the region's cluster runs on.
        accountId:
          description: Optional. When present it must be the account in the path.
          type: string
          pattern: ^acc_[A-Za-z0-9]+$
          example: acc_1a2b3c
        ipv4:
          description: Public IPv4 address the region's ingress answers on. With
            `ipv4Addresses` it must be that list's first entry. One of the two
            is required.
          example: 20.31.44.7
          type: string
          pattern: ^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$
        ipv4Addresses:
          description: Every public IPv4 address the region answers on, in zone order; the
            region's DNS records carry all of them. AWS regions have one per
            zone. A region with one address may send `ipv4` alone.
          example:
            - 203.0.113.10
            - 203.0.113.11
            - 203.0.113.12
          minItems: 1
          maxItems: 9
          type: array
          items:
            type: string
            pattern: ^(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$
        kubeEndpoint:
          type: string
          format: uri
          description: API server URL of the region's cluster.
        kubeCa:
          type: string
          minLength: 1
          description: PEM CA bundle for that API server.
        kubeToken:
          type: string
          minLength: 1
          description: Bearer token the control plane reaches the region with.
        kubeconfig:
          type: string
          minLength: 1
          description: Full kubeconfig for the region's cluster. Stored as a Secret on the
            cluster that issues the region's identity, which is how Crossplane
            delivers the certificate and pull credential.
        regionDisplayName:
          description: What a customer sees when picking this region. Defaults to the
            region name, cloud and provider region with the id after it; the
            console shows the raw id when nothing is set.
          example: frankfurt-azure-westeurope (rgn_1a2b3c)
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        providerRegion:
          type: string
          minLength: 1
          description: The cloud's own name for where the region runs, e.g. `westeurope`.
            The region's CR carries it, so a registration without one reconciles
            into a failure rather than a clear refusal here. On Azure it must be
            the lowercase ARM location name (`westeurope`), which AKS zone
            labels are built from; `WestEurope` or `West Europe` is rejected
            with 400 rather than lowercased.
          example: westeurope
        egressNetworkName:
          description: Linkerd EgressNetwork in the region, which the tunnel's TLSRoute
            attaches to. Without it the tunnel component stays off, because a
            region with no linkerd has nothing for that route to attach to.
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        availabilityZones:
          description: The region's availability zones, comma separated, as its nodes'
            `topology.kubernetes.io/zone` labels name them. On Azure each entry
            is either a bare zone number (`1`) or the AKS label form
            `<providerRegion>-<n>` (`westeurope-1`); bare numbers are normalised
            to the label form and anything else is rejected with 400. The tunnel
            runs one instance per zone and refuses fewer than three, so a region
            registered with fewer comes up with no tunnel.
          example: westeurope-1,westeurope-2,westeurope-3
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        storageBucket:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        storageAccountName:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        storageContainerName:
          description: Azure. The container the region's composition created for
            snapshots. Checked against the container environments actually write
            to, and rejected if they differ.
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        podIdentityRoleArn:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        restateGcpSaEmail:
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
      required:
        - region
        - cloud
        - kubeEndpoint
        - kubeCa
        - kubeToken
        - kubeconfig
        - providerRegion
      additionalProperties: false
    CreateByokRegistrationKeyRequest:
      type: object
      properties:
        cloud:
          type: string
          enum:
            - gcp
          description: Cloud the region's cluster runs on. BYOK supports GCP.
        providerRegion:
          type: string
          minLength: 1
          maxLength: 64
          description: The cloud's own name for where the region runs. The region must
            report the same name to register.
          example: us-central1
        regionDisplayName:
          description: The name the console shows for the region.
          example: customer-a us-central1
          type: string
          minLength: 1
          maxLength: 128
      required:
        - cloud
        - providerRegion
      additionalProperties: false
    DeleteByokRegionRequest:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
      required:
        - regionId
      additionalProperties: false
    RegionId:
      type: string
      pattern: ^rgn_[a-z0-9]+$
      example: rgn_a1b2c3d4e5
    DeregisterByocRegionRequest:
      type: object
      properties:
        region:
          type: string
          pattern: ^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$
          description: A short name for the region, unique across registrations.
            Identifies this registration so that repeating it is safe; the
            region's domain and Kubernetes objects are named after the generated
            region id instead.
          example: my-region
      required:
        - region
      additionalProperties: false
    CreateRegionRequest:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,38}[a-z0-9]$
          description: "Your name for the region, unique within the account: 3 to 40
            lower-case letters, digits and hyphens. It is the region's key:
            creating a region again with the same name and settings returns the
            same region, so a create can be retried safely. It cannot be
            changed."
          example: prod-eu
        displayName:
          description: Defaults to the name.
          type: string
          minLength: 1
          maxLength: 100
        setup:
          $ref: "#/components/schemas/RegionSetup"
        cloud:
          type: string
          enum:
            - aws
            - azure
            - gcp
        cloudRegion:
          type: string
          description: The AWS region, Azure location or GCP region the cluster runs in.
          example: europe-west2
        aws:
          type: object
          properties:
            accountId:
              type: string
              description: The AWS account the region runs in.
              example: "123456789012"
          required:
            - accountId
        azure:
          type: object
          properties:
            subscriptionId:
              type: string
              description: The Azure subscription the region runs in.
              example: 00000000-0000-0000-0000-000000000000
          required:
            - subscriptionId
        gcp:
          type: object
          properties:
            projectId:
              type: string
              description: The GCP project the region runs in. The region is tied to it.
              example: acme-restate-prod
          required:
            - projectId
        infrastructure:
          type: object
          properties:
            machineType:
              description: The node type of the cluster's node pool (GCP) or system nodes
                (Azure); not available on AWS.
              type: string
        identity:
          description: Ask for a region that signs in to your cloud with a short-lived
            token of its own from Restate's issuer. Your grant then trusts the
            issuer and the region's subject, and no value Restate chose for you.
            Without it, Restate decides when the region is created. The region
            keeps that identity for its whole life, so a repeat of the create
            that asks for another one is refused. A stage that has no issuer, or
            does not take this request yet, refuses it too.
          type: string
          enum:
            - region
        grantId:
          description: "GRANT: build the region with this READY region grant of the
            account or of its organization, instead of a grant of its own. The
            region starts building at once, keeps the grant for its whole life,
            and signs in with the grant's token, so identity is not taken with
            it. Its cloud and cloud account must be the grant's."
          $ref: "#/components/schemas/RegionGrantId"
      required:
        - name
        - cloud
        - cloudRegion
      additionalProperties: false
    RegionSetup:
      type: string
      enum:
        - INSTALLER
        - GRANT
      description: "How Restate reaches your cloud. GRANT (the default): you grant
        Restate access with a Terraform module, and Restate builds and operates
        the region from outside your account. INSTALLER: a region set up with an
        installer in your project; new ones can no longer be created."
    RegionGrantId:
      type: string
      pattern: ^rgr_[a-z0-9]+$
      example: rgr_x5z2y4qjmt
    SetRegionGrantRequest:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
        grant:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
          description: "The grant module's `grant` output, unchanged: roleArn and
            permissionsBoundary (AWS); workloadIdentityProvider, serviceAccount
            and identityProject (GCP); tenantId, clientId and resourceGroup
            (Azure)."
      required:
        - regionId
        - grant
      additionalProperties: false
    SetRegionAccessRequest:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
        entrySourceCidrs:
          description: "AWS: the IPv4 networks that may reach the region's load balancer
            directly, such as 203.0.113.0/24. Each must be a network address
            with no host bits set, at most 10 in all. Leave it out to admit
            every address. An empty list admits no client directly, so the
            region is reached only through PrivateLink. Restate's control plane
            is never admitted by this list."
          maxItems: 10
          type: array
          items:
            type: string
        privateLink:
          description: "AWS: publish a VPC endpoint service on the region's load balancer,
            so that the listed principals can connect through interface
            endpoints. Traffic through an endpoint does not carry the consumer's
            address, so the principals decide who connects, and entrySourceCidrs
            does not apply to it. Restate's own AWS account is always admitted,
            and no request can change that. With enabled false, or with the
            field left out, the region has no endpoint service."
          type: object
          properties:
            enabled:
              type: boolean
            allowedPrincipals:
              maxItems: 20
              type: array
              items:
                type: string
                pattern: ^arn:aws:iam::[0-9]{12}:(root|role\/.+|user\/.+)$
            acceptanceRequired:
              type: boolean
          required:
            - enabled
          additionalProperties: false
        dryRun:
          description: Check the settings against the region's infrastructure, and change
            nothing.
          type: boolean
      required:
        - regionId
      additionalProperties: false
      description: "Replaces the region's whole access setting, so a field left out
        returns to its default: every address is admitted and there is no
        endpoint service. Send the full setting each time."
    DeleteRegionRequest:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
        name:
          description: The region's name, in place of its id.
          type: string
      additionalProperties: false
    DescribeRegionRequest:
      type: object
      properties:
        regionId:
          $ref: "#/components/schemas/RegionId"
        name:
          description: The region's name, in place of its id.
          type: string
    CreateRegionGrantRequest:
      type: object
      properties:
        owner:
          description: Defaults to ACCOUNT.
          $ref: "#/components/schemas/RegionGrantOwner"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        cloud:
          type: string
          enum:
            - aws
            - azure
            - gcp
        aws:
          type: object
          properties:
            accountId:
              type: string
              pattern: ^[0-9]{12}$
              description: The AWS account the grant is in.
              example: "123456789012"
          required:
            - accountId
          additionalProperties: false
        azure:
          type: object
          properties:
            subscriptionId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
              description: The Azure subscription the grant is in.
              example: 00000000-0000-0000-0000-000000000000
          required:
            - subscriptionId
          additionalProperties: false
        gcp:
          type: object
          properties:
            projectId:
              type: string
              pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
              description: The GCP project the grant is in.
              example: acme-restate-prod
          required:
            - projectId
          additionalProperties: false
      required:
        - cloud
      additionalProperties: false
    RegionGrantOwner:
      type: string
      enum:
        - ACCOUNT
        - ORGANIZATION
      description: "Who owns the grant. ACCOUNT: the account in the path, whose
        administrators and management keys manage it and build regions with it.
        ORGANIZATION: the organization of the account in the path, whose
        administrators manage it and build regions with it in any of its
        accounts."
    ConfirmRegionGrantRequest:
      type: object
      properties:
        grantId:
          $ref: "#/components/schemas/RegionGrantId"
        grant:
          type: object
          propertyNames:
            type: string
          additionalProperties:
